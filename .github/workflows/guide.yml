name: Guide

# Checks and builds the new guide in guide/ from the published @hawiyah packages
# and runs its script, unit and end-to-end tests. It deploys and publishes
# nothing: the deployed guide is still built by pages.yml.
#
# The paths below are every input of the guide build and its tests, as listed in
# guide/build-inputs.json (the single source; guide/scripts/test/build-inputs.test.mjs
# requires the two path filters and the sparse checkout to equal it): guide/,
# docs/ (component pages and the files they link to), the root files
# components.json, NOTICE, CHANGELOG.md and pnpm-workspace.yaml, and this file.
on:
  push:
    paths:
      - 'guide/**'
      - 'docs/**'
      - 'components.json'
      - 'NOTICE'
      - 'CHANGELOG.md'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/guide.yml'
  pull_request:
    paths:
      - 'guide/**'
      - 'docs/**'
      - 'components.json'
      - 'NOTICE'
      - 'CHANGELOG.md'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/guide.yml'

permissions:
  contents: read

concurrency:
  group: guide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guide:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: guide
    env:
      HAWIYAH_BASE_PATH: /hawiyah/
    steps:
      # A sparse checkout holds only what the guide build and its tests read,
      # guide/build-inputs.json, as the path filters above. packages/, apps/,
      # examples/ and the other root files are absent, so a read of them fails
      # here instead of passing silently.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /guide/
            /docs/
            /components.json
            /NOTICE
            /CHANGELOG.md
            /pnpm-workspace.yaml
            /.github/workflows/guide.yml
          sparse-checkout-cone-mode: false
      - name: The package sources are absent
        run: |
          for dir in packages apps examples; do
            if [ -e "../$dir" ]; then echo "guide: ../$dir is present in the sparse checkout"; exit 1; fi
          done
          echo "guide: packages/, apps/ and examples/ are absent"
      # The runner context is not available in the job's env block.
      - name: Set the test output directory
        run: echo "GUIDE_TEST_OUTPUT=$RUNNER_TEMP/guide-e2e" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: guide/package-lock.json
      - name: Install the guide's exact lockfile
        run: npm ci
      # The registry check runs before lint and build; the build runs it again
      # (step 05) and checks the output (step 90).
      - name: Registry check
        run: npm run check:registry
      - name: Registry check negative controls
        run: npm run check:registry:negative
      - name: Lint
        run: npm run lint
      - name: Lint negative controls
        run: npm run lint:negative
      - name: Script tests
        run: npm run test:scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Production build
        run: npm run build
      - name: Development build check
        run: npm run build:dev-check
      - name: Unit tests
        run: npm run test:unit
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload failure records
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guide-failure
          path: |
            guide/.cache/logs
            guide/.cache/equivalence
            ${{ runner.temp }}/guide-e2e
          retention-days: 7
          if-no-files-found: ignore
