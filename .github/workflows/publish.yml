name: Publish packages to npm

# Pushing a tag such as v0.2.0 publishes that commit's seven @hawiyah packages.
# A manual run is a dry run unless "publish" is checked.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish for real (unchecked runs npm publish --dry-run)
        type: boolean
        default: false
      dist-tag:
        description: npm dist-tag (empty means latest, or next for a prerelease)
        type: string
        default: ''

permissions:
  contents: read
  id-token: write # npm provenance, and trusted publishing once configured

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package version
        if: github.event_name == 'push'
        run: |
          version="$(node -p "require('./packages/core/package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi
      - name: Build, verify and publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          DIST_TAG: ${{ inputs.dist-tag }}
        run: |
          args=()
          if [ -n "$DIST_TAG" ]; then args+=(--tag "$DIST_TAG"); fi
          if [ "$PUBLISH" = "true" ]; then args+=(--publish); fi
          node scripts/publish-packages.mjs "${args[@]}"
