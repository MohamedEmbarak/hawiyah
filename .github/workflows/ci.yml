name: CI

# Builds the packages and runs the unit, type, tarball and browser checks on
# every push and pull request. It deploys and publishes nothing.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Uses the pnpm version pinned in package.json "packageManager".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build:packages
      - name: Unit and token-contrast tests
        run: pnpm test
      - name: Typecheck the guide
        run: pnpm typecheck:playground
      - name: Verify package tarballs in a clean consumer
        run: pnpm check:packages
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Copy the guide's public assets
        run: node scripts/prepare-demo.mjs
      - name: Browser tests
        run: pnpm test:browser
      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
